# PulseWatch configuration
# Limits are whole numbers from 1 to 100 (percent).
# A reading above its limit is reported as HIGH.
CPU_LIMIT=80
MEM_LIMIT=80
DISK_LIMIT=90

# Seconds between readings
INTERVAL=5

# Minimum seconds between repeat alerts for the same ongoing problem
COOLDOWN=300

# Where readings are saved
LOG_FILE="pulsewatch.log"
